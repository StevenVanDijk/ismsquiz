<div class="badge-collection-page">
  <div class="page-header">
    <h2>Badges</h2>
    <p>{{ unlockedCount }} / {{ badges().length }} ontgrendeld</p>
  </div>

  <div class="progress-summary">
    <div class="progress-fill" [style.width.%]="badges().length ? (unlockedCount / badges().length * 100) : 0"></div>
  </div>

  <div class="badges-grid">
    @for (badge of badges(); track badge.id) {
      <app-badge-card
        [badge]="badge"
        [unlocked]="isUnlocked(badge)"
        [compact]="false">
      </app-badge-card>
    }
  </div>
</div>
